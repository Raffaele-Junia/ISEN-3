<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CyberScope{% endblock %}</title>
    <meta name="description" content="Colle un lien reçu par SMS ou e-mail : CyberScope te dit s'il est sûr avant que tu cliques.">
    <meta name="theme-color" content="#ECF0EE" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111614" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2317201C' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%232443C4'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="wrap">
            <a class="wordmark" href="/">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                    <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="3"/>
                    <circle cx="16" cy="16" r="5.5" fill="var(--lens)"/>
                </svg>
                CyberScope
            </a>
            <nav class="site-nav" aria-label="Navigation principale">
                <a href="/history" {% if active == "history" %}aria-current="page"{% endif %}>Historique</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="wrap">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <p>
                CyberScope donne une estimation à partir de signaux publics. Un lien
                jugé sûr peut quand même être piégé : en cas de doute, va directement
                sur le site officiel plutôt que de cliquer.
            </p>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
