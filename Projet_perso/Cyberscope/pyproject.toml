[project]
name = "cyberscope"
version = "0.2.0"
description = "Vérifie si un lien est sûr avant de cliquer : réputation, âge du domaine, certificat, redirections et signaux de phishing."
readme = "README.md"
authors = [
    { name = "Raffaele-Junia", email = "raffaele.farvacque@student.junia.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dnspython>=2.6",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "requests>=2.32",
    "truststore>=0.10",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
cyberscope = "cyberscope.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
