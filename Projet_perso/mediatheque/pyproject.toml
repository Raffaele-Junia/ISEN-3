[project]
name = "mediatheque"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raffaele FARVACQUE", email = "raffaele.farvacque@student.junia.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
mediatheque = "mediatheque:main"

