[project]
name = "mediatheque"
version = "0.1.0"
description = "Gestion de médiathèque : catalogue, emprunts, réservations, comptes adhérents et responsable"
readme = "README.md"
authors = [
    { name = "Raffaele FARVACQUE", email = "raffaele.farvacque@student.junia.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
]

[project.scripts]
mediatheque = "mediatheque:main"
mediatheque-init = "mediatheque.init_db:main"
mediatheque-web = "mediatheque.web.app:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
