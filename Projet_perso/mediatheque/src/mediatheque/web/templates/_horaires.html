{# Horaires d'ouverture : une seule source pour la connexion et « Ma carte » (C5). #}
{% macro horaires(classe="horaires") %}
<dl class="{{ classe }}" aria-label="Horaires d'ouverture">
  <dt>Mar · Jeu</dt><dd>14 h – 19 h</dd>
  <dt>Mer · Sam</dt><dd>10 h – 18 h</dd>
  <dt>Ven</dt><dd>14 h – 20 h</dd>
  <dt>Dim · Lun</dt><dd>fermé</dd>
</dl>
{% endmacro %}
